version: '3.9'
services:
  webpush:
    build: .
    image: web-push-service:latest
    container_name: web-push-service
    restart: unless-stopped
    environment:
      - PORT=3000
      - VAPID_SUBJECT=mailto:admin@example.com
      # Uncomment to require API key for /api/notify
      # - API_KEY=your-secret-key
    ports:
      - "3000:3000"
    volumes:
      # Persist generated VAPID keys and subscriptions
      - ./config:/app/config
      - ./data:/app/data

