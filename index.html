<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Notification Test</title>
</head>
<body>
    <h1>Push Notification Test</h1>
    <p>Check the console for initialization status.</p>
    
    <div style="margin: 20px 0;">
        <h2>Test Controls</h2>
        <button id="subscribeBtn" onclick="testSubscribe()" style="margin: 5px; padding: 10px;">Subscribe</button>
        <button id="unsubscribeBtn" onclick="testUnsubscribe()" style="margin: 5px; padding: 10px;">Unsubscribe</button>
        <button id="checkStatusBtn" onclick="checkStatus()" style="margin: 5px; padding: 10px;">Check Status</button>
        <button id="requestPermissionBtn" onclick="requestPermission()" style="margin: 5px; padding: 10px;">Request Permission</button>
    </div>
    
    <div id="status" style="margin: 20px 0; padding: 10px; border: 1px solid #ddd; background: #f9f9f9;">
        <h3>Status</h3>
        <p id="permissionStatus">Permission: Unknown</p>
        <p id="subscriptionStatus">Subscription: Unknown</p>
        <p id="endpointInfo">Endpoint: Not set</p>
    </div>
    
<!-- Add to your HTML page -->
<script>
    console.log("hiii")
    const API_KEY = '422e6f07-85db-4979-a1de-7dfbebe98688'; // ✅ Your actual API key
    const SERVER_URL = 'http://13.126.228.42';
    
    // Load and initialize SDK
    function loadNotificationSDK() {
        console.log("hiii4")
      const script = document.createElement('script');
      script.src = SERVER_URL + '/sdk.js';
      script.onload = () => {
        // Initialize with just your API key
        PN.init({
          apiKey: API_KEY,
          baseUrl: SERVER_URL,
          serviceWorkerUrl: '/pn-sw.js'  // Use local service worker
        }).then(() => {
          console.log('✅ Push notifications ready!');
          console.log('📊 PN object:', PN);
          // Test subscription manually after init
          if ('serviceWorker' in navigator && 'PushManager' in window) {
            console.log('🔧 Testing subscription...');
            // The SDK should handle subscription automatically, but let's check if it created one
            setTimeout(() => {
              navigator.serviceWorker.ready.then(registration => {
                registration.pushManager.getSubscription().then(subscription => {
                  if (subscription) {
                    console.log('✅ Found existing subscription:', subscription.endpoint);
                  } else {
                    console.log('❌ No subscription found - trying to create one');
                    // Force subscription if the SDK didn't create one
                    if (PN.subscribe) {
                      PN.subscribe().then(() => console.log('✅ Manual subscription successful'))
                             .catch(err => console.error('❌ Manual subscription failed:', err));
                    }
                  }
                });
              });
            }, 2000);
          } else {
            console.log('❌ Push notifications not supported');
          }
        }).catch(err => {
          console.error('Failed to initialize:', err);
        });
      };
      document.head.appendChild(script);
    }
    
    // Load on page ready
    if (document.readyState === 'loading') {
        console.log("hii2")
      document.addEventListener('DOMContentLoaded', loadNotificationSDK);
    } else {
        console.log("hii3")
      loadNotificationSDK();
    }
  </script>
  
  <script>
    // Test functions for manual control
    function updateStatus() {
        const permissionStatus = document.getElementById('permissionStatus');
        const subscriptionStatus = document.getElementById('subscriptionStatus');
        const endpointInfo = document.getElementById('endpointInfo');
        
        permissionStatus.textContent = `Permission: ${Notification.permission}`;
        
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            navigator.serviceWorker.ready.then(registration => {
                registration.pushManager.getSubscription().then(subscription => {
                    if (subscription) {
                        subscriptionStatus.textContent = 'Subscription: Active';
                        endpointInfo.textContent = `Endpoint: ${subscription.endpoint.substring(0, 50)}...`;
                    } else {
                        subscriptionStatus.textContent = 'Subscription: Not active';
                        endpointInfo.textContent = 'Endpoint: Not set';
                    }
                });
            });
        }
    }
    
    function requestPermission() {
        if ('Notification' in window) {
            Notification.requestPermission().then(permission => {
                console.log('Permission result:', permission);
                updateStatus();
            });
        }
    }
    
    function testSubscribe() {
        console.log('🔧 Manual subscribe test...');
        // The SDK doesn't have a separate subscribe method - it subscribes during init
        // So we need to call init again or manually subscribe
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            if (Notification.permission !== 'granted') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        reinitializeSDK();
                    } else {
                        console.error('❌ Permission denied');
                    }
                });
            } else {
                reinitializeSDK();
            }
        } else {
            console.error('❌ Push notifications not supported');
        }
    }
    
    function reinitializeSDK() {
        console.log('🔧 Re-initializing SDK...');
        if (window.PN) {
            PN.init({
                apiKey: API_KEY,
                baseUrl: SERVER_URL,
                serviceWorkerUrl: '/pn-sw.js'  // Use local service worker
            }).then(() => {
                console.log('✅ Re-initialization successful');
                updateStatus();
                // Check subscription after a delay
                setTimeout(() => {
                    navigator.serviceWorker.ready.then(registration => {
                        registration.pushManager.getSubscription().then(subscription => {
                            if (subscription) {
                                console.log('✅ Subscription created:', subscription.endpoint);
                            } else {
                                console.log('❌ No subscription after init');
                            }
                        });
                    });
                }, 1000);
            }).catch(err => {
                console.error('❌ Re-initialization failed:', err);
                updateStatus();
            });
        }
    }
    
    function testUnsubscribe() {
        console.log('🔧 Manual unsubscribe test...');
        if (window.PN && PN.unsubscribe) {
            PN.unsubscribe().then(() => {
                console.log('✅ Manual unsubscription successful');
                updateStatus();
            }).catch(err => {
                console.error('❌ Manual unsubscription failed:', err);
                updateStatus();
            });
        } else if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(registration => {
                registration.pushManager.getSubscription().then(subscription => {
                    if (subscription) {
                        subscription.unsubscribe().then(() => {
                            console.log('✅ Direct unsubscription successful');
                            updateStatus();
                        });
                    }
                });
            });
        }
    }
    
    function checkStatus() {
        console.log('🔧 Checking status...');
        updateStatus();
        
        // Also check if PN object exists
        if (window.PN) {
            console.log('✅ PN object available:', PN);
            console.log('🔍 VAPID Public Key:', PN.vapidPublicKey);
            
            // Test config endpoint directly
            fetch(`${SERVER_URL}/api/config?apiKey=${API_KEY}`)
                .then(response => response.json())
                .then(config => {
                    console.log('🔍 Config response:', config);
                    if (config.vapid_public_key) {
                        console.log('✅ VAPID key found in config');
                        PN.vapidPublicKey = config.vapid_public_key;
                    } else {
                        console.log('❌ No VAPID key in config response');
                    }
                })
                .catch(err => console.error('❌ Config fetch failed:', err));
        } else {
            console.log('❌ PN object not available');
        }
    }
    
    // Update status on page load
    setTimeout(updateStatus, 3000);
  </script>
  
  <!-- Ready to use! Your API key is already included above. -->
  <!-- The SDK handles permission, subscription, and VAPID keys -->
</body>
</html>
